<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Calcolatrice</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: #0d0d0d;
    font-family: "Segoe UI", sans-serif;
}

.calculator {
    background: #1a1a1a;
    padding: 20px;
    border-radius: 20px;
    width: 330px;
    box-shadow: 0 0 30px rgba(0,0,0,0.5);
}

.display {
    width: 100%;
    height: 60px;
    border: none;
    border-radius: 12px;
    background: #000;
    color: #0f0;
    font-size: 2.2rem;
    padding: 10px;
    margin-bottom: 20px;
    text-align: right;
    letter-spacing: 2px;
}

.buttons {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 12px;
}

button {
    padding: 18px;
    border-radius: 12px;
    border: none;
    font-size: 1.3rem;
    cursor: pointer;
    background: #262626;
    color: white;
    transition: .15s;
}

button:hover {
    background: #333;
}

.operator {
    background: #ff9800;
}

.operator:hover {
    background: #e68900;
}

.equal {
    background: #00c853;
    grid-column: span 2;
}

.equal:hover {
    background: #00a844;
}
</style>
</head>

<body>

<div class="calculator">
    <input type="text" id="display" class="display" disabled>

    <div class="buttons">
        <button onclick="radice()">√</button>
        <button onclick="potenza()">x²</button>
        <button onclick="percentuale()">%</button>
        <button onclick="clearAll()" class="operator">C</button>

        <button onclick="seno()">sin</button>
        <button onclick="coseno()">cos</button>
        <button onclick="tangente()">tan</button>
        <button onclick="backspace()">⌫</button>

        <button onclick="addNumber('7')">7</button>
        <button onclick="addNumber('8')">8</button>
        <button onclick="addNumber('9')">9</button>
        <button onclick="setOperator('/')">÷</button>

        <button onclick="addNumber('4')">4</button>
        <button onclick="addNumber('5')">5</button>
        <button onclick="addNumber('6')">6</button>
        <button onclick="setOperator('*')">×</button>

        <button onclick="addNumber('1')">1</button>
        <button onclick="addNumber('2')">2</button>
        <button onclick="addNumber('3')">3</button>
        <button onclick="setOperator('-')">−</button>

        <button onclick="addNumber('0')">0</button>
        <button onclick="addNumber('.')">.</button>
        <button onclick="calcola()" class="equal">=</button>
        <button onclick="setOperator('+')" class="operator">+</button>
    </div>
</div>

<script>
let display = document.getElementById("display");
let elementi = [];
let memoria = 0;

function addNumber(num) {
    display.value += num;
}

function setOperator(op) {
    elementi.push(parseFloat(display.value));
    elementi.push(op);
    display.value = "";
}

function calcola() {
    elementi.push(parseFloat(display.value));

    for (let i = 1; i < elementi.length; i += 2) {
        if (elementi[i] === "*" || elementi[i] === "/") {
            let a = elementi[i - 1];
            let b = elementi[i + 1];
            let risultato = elementi[i] === "*" ? a * b : a / b;
            elementi.splice(i - 1, 3, risultato);
            i -= 2;
        }
    }

    let risultato = elementi[0];
    for (let i = 1; i < elementi.length; i += 2) {
        if (elementi[i] === "+") risultato += elementi[i + 1];
        if (elementi[i] === "-") risultato -= elementi[i + 1];
    }

    display.value = risultato;
    elementi = [];
}

function clearAll() {
    display.value = "";
    elementi = [];
}

function backspace() {
    display.value = display.value.slice(0, -1);
}

function potenza() {
    let n = parseFloat(display.value);
    display.value = Math.pow(n, 2);
}

function radice() {
    let n = parseFloat(display.value);
    display.value = Math.sqrt(n);
}

function percentuale() {
    let n = parseFloat(display.value);
    display.value = n / 100;
}

function seno() {
    display.value = Math.sin(parseFloat(display.value));
}

function coseno() {
    display.value = Math.cos(parseFloat(display.value));
}

function tangente() {
    display.value = Math.tan(parseFloat(display.value));
}

function memoryAdd() {
    memoria += parseFloat(display.value);
}

function memoryRead() {
    display.value = memoria;
}

function memoryClear() {
    memoria = 0;
}
</script>

</body>
</html>
