<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Conversione decimale → binario</title>
  </head>
  <body>
    <h1>ESERCITAZIONE HTML WHILE</h1>

    <p>Inserisci 4 numeri (da 0 a 255):</p>
    
    <input type="number" id="num1" min="0" max="255">
    <input type="number" id="num2" min="0" max="255">
    <input type="number" id="num3" min="0" max="255">
    <input type="number" id="num4" min="0" max="255">

    <br><br>
    <button onclick="converti()">Converti in binario</button>

    <p id="demo"></p>

    <script>
      function converti() {
        let n1 = parseInt(document.getElementById("num1").value);
        let n2 = parseInt(document.getElementById("num2").value);
        let n3 = parseInt(document.getElementById("num3").value);
        let n4 = parseInt(document.getElementById("num4").value);

        let numeri = [n1, n2, n3, n4];
        let risultato = [];

        let i = 0;
        while (i < numeri.length) {
          let n = numeri[i];
          let bin = "";
          if (isNaN(n) || n < 0 || n > 255) {
            risultato.push("Valore non valido");
          } else {
            while (n > 0) {
              let r = n % 2;
              bin = r + bin;
              n = parseInt(n / 2);
            }
            while (bin.length < 8) {
              bin = "0" + bin;
            }
            risultato.push(bin);
          }
          i++;
        }
        document.getElementById("demo").innerHTML = risultato.join(" . ");
      }
    </script>
  </body>
</html>
