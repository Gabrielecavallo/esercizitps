<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <title>Conversione decimale → binario e subnet Mask</title>
  </head>
  <body>
    <h1>ESERCITAZIONE HTML SUBNET MASK</h1>

    <p>Inserisci 4 numeri (da 0 a 255) e dopo lo / (da 1 a 31):</p>
    
    <input type="number" id="num1" min="0" max="255">
    <input type="number" id="num2" min="0" max="255">
    <input type="number" id="num3" min="0" max="255">
    <input type="number" id="num4" min="0" max="255"> 
    <p2> / </p2>
    <input type="number" id="lunghezza" min="1" max="31">

    <br><br>
    <button onclick="converti()">Converti in binario e fornisci subnet mask</button>

    <p id="demo"></p>

    <script>
      function converti() {
        let n1 = parseInt(document.getElementById("num1").value);
        let n2 = parseInt(document.getElementById("num2").value);
        let n3 = parseInt(document.getElementById("num3").value);
        let n4 = parseInt(document.getElementById("num4").value);
        let lunghezza = parseInt(document.getElementById("lunghezza").value);
        let numeri = [n1, n2, n3, n4];
        let risultato = [];
        let risultato1 = [];

        let i = 0;
        while (i < numeri.length) {
          let n = numeri[i];
          let bin = "";
          if (isNaN(n) || n < 0 || n > 255) {
            risultato.push("Valore non valido");
          } else {
            while (n > 0) {
              let r = n % 2;
              bin = r + bin;
              n = parseInt(n / 2);
            }
            while (bin.length < 8) {
              bin = "0" + bin;
            }
            risultato.push(bin);
          }
          i++;
        }

        let subnetMask = "";
        for (let a = 0; a < lunghezza; a++) {
          subnetMask = subnetMask + "1";
          if (a == 7 || a == 15 || a == 23) {
            subnetMask = subnetMask + " . ";
          }
        }
        for (let b = lunghezza; b < 32; b++) {
          subnetMask = subnetMask + "0";
          if (b == 7 || b == 15 || b == 23) {
            subnetMask = subnetMask + " . ";
          }
        }
        risultato1.push(subnetMask);

        document.getElementById("demo").innerHTML = 
          "Indirizzo binario:<br>" + risultato.join(" . ") + 
          "<br>Subnet mask:<br>" + risultato1.join(" . ");
      }
    </script>
  </body>
</html>
