<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogo - Calisthenics Shop</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header></header>

    <div class="container">
        <div>
            <h1 style="margin-bottom: 10px;">CATALOGO</h1>
            <p style="color: #999999; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 30px;">Attrezzi professionali per calisthenics</p>
        </div>

        <div class="search-bar">
            <input 
                type="text" 
                id="searchInput" 
                placeholder="Cerca per brand o prodotto..."
            >
            <button onclick="performSearch()">CERCA</button>
        </div>

        <div id="productsGrid" class="grid-products"></div>

        <div id="noResults" style="display: none; text-align: center; padding: 60px 20px;">
            <h2 style="margin-bottom: 20px;">Nessun prodotto trovato</h2>
            <button class="btn" onclick="clearSearch()">Torna al catalogo</button>
        </div>
    </div>

    <script src="app.js"></script>
    <script>
        function renderProducts(productList = null) {
            const grid = document.getElementById('productsGrid');
            const noResults = document.getElementById('noResults');
            const products = productList || shop.products;

            if (products.length === 0) {
                grid.style.display = 'none';
                noResults.style.display = 'block';
                return;
            }

            grid.style.display = 'grid';
            noResults.style.display = 'none';

            grid.innerHTML = products.map(product => `
                <div class="product-card" onclick="goToProduct(${product.id})">
                    <div class="product-image ${!product.immagine ? 'error' : ''}">
                        ${product.immagine ? 
                            `<img src="${product.immagine}" alt="${product.nomeProdotto}" onerror="this.parentElement.classList.add('error'); this.parentElement.innerHTML = 'Immagine non disponibile';">` 
                            : 'Immagine non disponibile'
                        }
                    </div>
                    <div class="product-info">
                        <div class="product-brand">${product.brand}</div>
                        <div class="product-name">${product.nomeProdotto}</div>
                        <div class="product-description">${product.descrizione}</div>
                        <div class="product-price" style="margin-top: auto;">${formatPrice(product.prezzo)}</div>
                    </div>
                </div>
            `).join('');
        }

        function performSearch() {
            const query = document.getElementById('searchInput').value.trim();
            if (query === '') {
                renderProducts();
                return;
            }

            const results = shop.searchProducts(query);
            renderProducts(results);
        }

        function clearSearch() {
            document.getElementById('searchInput').value = '';
            renderProducts();
        }

        function goToProduct(id) {
            window.location.href = `product.html?id=${id}`;
        }

        // Ricerca al digitare (debounce)
        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', function() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                performSearch();
            }, 300);
        });

        // Render iniziale
        document.addEventListener('DOMContentLoaded', function() {
            setTimeout(() => {
                renderProducts();
            }, 100);
        });
    </script>
</body>
</html>
