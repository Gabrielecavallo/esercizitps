
<!DOCTYPE html>
<html lang="it">

<head>

<meta charset="UTF-8">
<title>Importa CSV</title>

<style>

body{
    font-family: Arial, Helvetica, sans-serif;
    background:#f4f6f8;
    margin:0;
    padding:20px;
    text-align:center;
}

h2{
    margin-bottom:20px;
}

input[type="file"]{
    margin-bottom:25px;
}

.container{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.persona{
    background:white;
    padding:15px;
    width:220px;
    border-radius:10px;
    box-shadow:0 3px 8px rgba(0,0,0,0.15);
    text-align:left;
}

</style>


<script>

function caricaFile(event){

  var file = event.target.files[0];

  var reader = new FileReader();

  reader.onload = function(e){

    var testo = e.target.result;

    var righe = testo.split("\n");

    mostraPersone(righe, 1);

  };

  reader.readAsText(file);
}


function mostraPersone(righe, i){

  if(i >= righe.length){
    return;
  }

  var dati = righe[i].split(",");

  var nome = dati[0];
  var cognome = dati[1];
  var eta = dati[2];
  var citta = dati[3];

  var blocco = document.createElement("div");

  blocco.className = "persona";

  blocco.innerHTML =
    "<b>Nome:</b> " + nome + "<br>" +
    "<b>Cognome:</b> " + cognome + "<br>" +
    "<b>Età:</b> " + eta + "<br>" +
    "<b>Città:</b> " + citta;

  document.getElementById("output").appendChild(blocco);

  mostraPersone(righe, i + 1);

}

</script>

</head>

<body>

<h2>Importa file CSV</h2>

<input type="file" onchange="caricaFile(event)">

<div class="container" id="output"></div>

</body>

</html>
