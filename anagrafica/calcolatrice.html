<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Calcolatrice</title>

<style>
    body {
        margin: 0;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background: #0d0d0d;
        font-family: "Segoe UI", sans-serif;
    }

    .calculator {
        background: #1a1a1a;
        padding: 20px;
        border-radius: 20px;
        width: 330px;
        box-shadow: 0 0 30px rgba(0,0,0,0.5);
    }

    .display {
        width: 100%;
        height: 60px;
        border: none;
        border-radius: 12px;
        background: #000;
        color: #0f0;
        font-size: 2.2rem;
        padding: 10px;
        margin-bottom: 20px;
        text-align: right;
        letter-spacing: 2px;
    }

    .buttons {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 12px;
    }

    button {
        padding: 18px;
        border-radius: 12px;
        border: none;
        font-size: 1.3rem;
        cursor: pointer;
        background: #262626;
        color: white;
        transition: .15s;
    }

    button:hover {
        background: #333;
    }

    .operator {
        background: #ff9800;
    }

    .operator:hover {
        background: #e68900;
    }

    .equal {
        background: #00c853;
        grid-column: span 2;
    }

    .equal:hover {
        background: #00a844;
    }
</style>
</head>

<body>

<div class="calculator">
    <input type="text" id="display" class="display" disabled />

    <div class="buttons">

        <button onclick="append('Math.sqrt(')">√</button>
        <button onclick="append('**')">xⁿ</button>
        <button onclick="append('/100')">%</button>
        <button onclick="clearDisplay()" class="operator">C</button>

        <button onclick="append('Math.sin(')">sin</button>
        <button onclick="append('Math.cos(')">cos</button>
        <button onclick="append('Math.tan(')">tan</button>
        <button onclick="backspace()">⌫</button>

        <button onclick="append('7')">7</button>
        <button onclick="append('8')">8</button>
        <button onclick="append('9')">9</button>
        <button onclick="append('/')">÷</button>

        <button onclick="append('4')">4</button>
        <button onclick="append('5')">5</button>
        <button onclick="append('6')">6</button>
        <button onclick="append('*')">×</button>

        <button onclick="append('1')">1</button>
        <button onclick="append('2')">2</button>
        <button onclick="append('3')">3</button>
        <button onclick="append('-')">−</button>

        <button onclick="append('0')">0</button>
        <button onclick="append('.')">.</button>
        <button onclick="calculate()" class="equal">=</button>
        <button onclick="append('+')" class="operator">+</button>

    </div>
</div>

<script>
let memory = 0;

function append(value) {
    document.getElementById("display").value += value;
}

function clearDisplay() {
    document.getElementById("display").value = "";
}

function backspace() {
    let d = document.getElementById("display");
    d.value = d.value.slice(0, -1);
}

function calculate() {
    try {
        let result = eval(document.getElementById("display").value);
        document.getElementById("display").value = result;
    } catch (e) {
        document.getElementById("display").value = "Errore";
    }
}
function memoryClear() {
    memory = 0;
}
</script>

</body>
</html>
