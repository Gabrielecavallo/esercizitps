<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Anagrafica CSV</title>

<style>

body{
    font-family: Arial, Helvetica, sans-serif;
    background-color:#f4f6f8;
    margin:0;
    padding:20px;
    text-align:center;
}

h1{
    margin-bottom:20px;
}

#fileInput{
    margin-bottom:30px;
}

#contenitore{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:20px;
}

.card{
    background:white;
    width:250px;
    padding:15px;
    border-radius:10px;
    box-shadow:0 3px 8px rgba(0,0,0,0.15);
    text-align:left;
}

.card h3{
    margin-top:0;
    color:#333;
}

.card p{
    margin:5px 0;
    color:#555;
}

</style>
</head>

<body>

<h1>Anagrafica da file CSV</h1>

<input type="file" id="fileInput" accept=".csv">

<div id="contenitore"></div>

<script>

const inputFile = document.getElementById("fileInput");

inputFile.addEventListener("change", leggiFile);

function leggiFile(event){

    const file = event.target.files[0];

    const reader = new FileReader();

    reader.onload = function(e){

        const contenuto = e.target.result;

        const righe = contenuto.split("\n");

        const dati = [];

        for(let i = 1; i < righe.length; i++){

            const colonne = righe[i].split(",");

            if(colonne.length >= 4){

                dati.push({
                    nome: colonne[0],
                    cognome: colonne[1],
                    email: colonne[2],
                    telefono: colonne[3]
                });

            }

        }

        creaBlocchi(dati,0);

    };

    reader.readAsText(file);

}

function creaBlocchi(lista, indice){

    if(indice >= lista.length){
        return;
    }

    const persona = lista[indice];

    const card = document.createElement("div");
    card.className = "card";

    card.innerHTML = `
        <h3>${persona.nome} ${persona.cognome}</h3>
        <p>Email: ${persona.email}</p>
        <p>Telefono: ${persona.telefono}</p>
    `;

    document.getElementById("contenitore").appendChild(card);

    creaBlocchi(lista, indice + 1);

}

</script>

</body>
</html>
